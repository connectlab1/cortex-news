name: Executar ETL Cortex News

on:
  schedule:
    # Executa todos os dias às 06:00 e 18:00 (Horário UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Pipeline ETL
        env:
          # Caso seu script utilize chaves/APIs, configure-as em Settings > Secrets
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          python main.py

      - name: Commitar e enviar novos posts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(auto): novos posts gerados pelo pipeline ETL"
            git push
          else
            echo "Nenhum novo post para publicar."
          fi
