name: Executar Pipeline ETL (Cortex News)

on:
  schedule:
    # Executa automaticamente todos os dias às 06:00 e 18:00 (Horário UTC)
    - cron: '0 6,18 * * *'
  # Permite disparar o script manualmente a qualquer momento pelo painel do GitHub
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código atual do repositório
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as dependências do seu script
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Executa o pipeline ETL para extrair e gerar os novos posts em _posts/
      - name: Executar Pipeline ETL
        env:
          # Caso seu script utilize chaves/APIs, configure em Settings > Secrets and variables > Actions
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          python main.py

      # 5. Salva e faz o Push dos novos arquivos Markdown de volta para a branch main
      - name: Enviar novos posts para o repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/
          
          # Verifica se algum arquivo novo foi criado antes de commitar
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat(auto): novos posts gerados pelo pipeline ETL [skip ci]"
            git push origin main
          else
            echo "Nenhum novo post para publicar nesta execução."
          fi
