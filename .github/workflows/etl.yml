name: Executar Pipeline ETL - Cortex News

on:
  schedule:
    # Roda a cada 2 horas (em sintaxe Cron UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite disparar o robô manualmente pelo botão no GitHub!

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências do bot
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests html2text

    - name: Executar o pipeline de coleta e limpeza
      run: python main.py

    - name: Fazer commit e push dos novos posts gerados
      run: |
        git config --global user.name "Cortex Bot"
        git config --global user.email "bot@cortexnews.local"
        git add _posts/ data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "feat: novos posts processados pelo Cortex [skip ci]" && git push)
