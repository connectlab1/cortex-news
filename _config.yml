# ==========================================
# Configurações Globais do Cortex News
# ==========================================
title: "Cortex News"
email: "contato@connectlab.ddns.net"
description: "Fluxo automatizado de notícias, tecnologia e automação."
url: "https://connectlab1.github.io"
baseurl: "/cortex-news"

author:
  name: "Jean de Arruda"
  github: "connectlab1"

# ==========================================
# Compilação Sass / SCSS
# ==========================================
sass:
  sass_dir: assets/css
  style: compressed

# ==========================================
# Paginação (jekyll-paginate)
# ==========================================
paginate: 6
paginate_path: "/page:num/"

# ==========================================
# Formatação de Datas e Permalinks
# ==========================================
permalink: /:categories/:year/:month/:day/:title/
timezone: "America/Sao_Paulo"

# ==========================================
# Plugins e Exclusões de Build
# ==========================================
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/
  - src/
  - venv/
  - requirements.txt
  - main.py
```[cite: 7]

### Dica para o CachyOS (Linux) ao salvar:
Se você estiver editando o arquivo direto no terminal ou via VS Code no seu CachyOS, garanta que a codificação de fim de linha esteja configurada como **LF** (e não CRLF do Windows). No terminal, você pode rodar o comando abaixo para normalizar as quebras de linha caso necessário:
```bash
dos2unix _config.yml
